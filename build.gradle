plugins {
    id 'java'
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '1.0.0-alpha'
group = 'com.descentmtb'
base.archivesName = 'descentmtb'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.ryanhcode.dev/releases' }
}

dependencies {
    jarJar(implementation('net.java.dev.jna:jna-platform:5.14.0')) { transitive = false }
    jarJar(implementation('dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0'))
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Headless physics "feel spec" tests (no Minecraft needed): .\gradlew.bat test
test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
        events 'passed', 'failed'
        exceptionFormat = 'full'
    }
}

neoForge {
    version = "21.1.250"

    runs {
        client {
            client()
        }
        // .\gradlew.bat runClientQuick - straight into the 'New World' test save
        clientQuick {
            client()
            programArguments.addAll('--quickPlaySingleplayer', 'New World')
        }
        // dev test pilot: rides a script, saves run/screenshots/mtb_*.png, quits
        clientAuto {
            client()
            programArguments.addAll('--quickPlaySingleplayer', 'New World')
            systemProperty 'descentmtb.autopilot', 'true'
            systemProperty 'descentmtb.autopilot.keepOpen', providers.gradleProperty('autopilotKeepOpen').orElse('false').get()
        }
        clientWall {
            client()
            programArguments.addAll('--quickPlaySingleplayer', 'MTB Wallride Regression')
            systemProperty 'descentmtb.autopilot', 'true'
            systemProperty 'descentmtb.wallrideOnly', 'true'
        }
        server {
            server()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        descentmtb {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
