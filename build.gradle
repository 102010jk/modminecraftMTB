plugins {
    id 'java'
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '1.0.0-alpha'
group = 'com.descentmtb'
base.archivesName = 'descentmtb'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Headless physics "feel spec" tests (no Minecraft needed): .\gradlew.bat test
test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
        events 'passed', 'failed'
        exceptionFormat = 'full'
    }
}

neoForge {
    version = "21.1.190"

    runs {
        client {
            client()
        }
        // .\gradlew.bat runClientQuick - straight into the 'New World' test save
        clientQuick {
            client()
            programArguments.addAll('--quickPlaySingleplayer', 'New World')
        }
        // dev test pilot: rides a script, saves run/screenshots/mtb_*.png, quits
        clientAuto {
            client()
            programArguments.addAll('--quickPlaySingleplayer', 'New World')
            systemProperty 'descentmtb.autopilot', 'true'
        }
        server {
            server()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        descentmtb {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
