modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "descentmtb"
version = "1.0.0-alpha"
displayName = "Descent MTB"
authors = "jakub"
description = '''
Mountain biking and trail building in Minecraft: enduro and dirt-jump bikes,
motocross and pit bikes, suspension and tyre grip, tricks and chase cameras.
Build trails, jumps, berms and wooden decks; customise bikes in the workshop,
record GPS routes and customise bikes in the workshop.
Rebindable keyboard controls and GLFW gamepad support.
'''

[[mixins]]
config = "descentmtb.mixins.json"

[[dependencies.descentmtb]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.descentmtb]]
modId = "minecraft"
type = "required"
versionRange = "[1.21,1.22)"
ordering = "NONE"
side = "BOTH"

# Sable moving platforms: the bike rides on them when the mod is present, nothing else needs it
[[dependencies.descentmtb]]
modId = "sable"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"
