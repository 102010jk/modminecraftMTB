modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "descentmtb"
version = "1.0.0-alpha"
displayName = "Descent MTB"
authors = "jakub"
description = '''
Descenders in Minecraft: a full-suspension enduro bike on real physics -
spring/damper suspension, tyre grip, a rider you can pump and pop with,
bunny hops, flips and spins, bails and a chase camera. Controller (GLFW)
and keyboard, Descenders bindings.
'''

[[mixins]]
config = "descentmtb.mixins.json"

[[dependencies.descentmtb]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.descentmtb]]
modId = "minecraft"
type = "required"
versionRange = "[1.21,1.22)"
ordering = "NONE"
side = "BOTH"

# Sable moving platforms: the bike rides on them when the mod is present, nothing else needs it
[[dependencies.descentmtb]]
modId = "sable"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"
