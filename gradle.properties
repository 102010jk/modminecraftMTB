# trustStoreType=WINDOWS-ROOT lets Gradle/Java trust this machine's OS cert
# store (needed behind the local TLS-intercepting proxy, else PKIX failures).
org.gradle.jvmargs=-Xmx2G -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
